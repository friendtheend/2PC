model:
  model_id: meta-llama/Meta-Llama-3-8B
  device_map: auto
  torch_dtype: bfloat16
  trust_remote_code: true

poly:
  enabled: true
  replace_odd_layers: true

# Optional: set to your training output/checkpoint path.
# checkpoint_path: outputs/llama3_minimal

evaluation:
  dataset_name: allenai/ai2_arc
  subset: ARC-Easy
  split: test
  max_samples: 1000
  max_new_tokens: 4
  do_sample: false
